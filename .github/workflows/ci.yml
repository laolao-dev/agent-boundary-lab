name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline validation
        env:
          OPENALEX_API_KEY: ""
          UV_OFFLINE: "true"
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run basedpyright
